<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <linearGradient id="qaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="qaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#qaBg)" />

  <!-- Subtle Neural Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.5">
    <line x1="0" y1="320" x2="1280" y2="320" />
    <circle cx="640" cy="320" r="260" fill="none" />
    <circle cx="640" cy="320" r="320" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- Outer Console Frame -->
  <rect x="60" y="40" width="1160" height="560" rx="20" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="80" y="60" width="1120" height="520" rx="16" fill="#030712" stroke="url(#cyanNeon)" stroke-width="1.5" opacity="0.95" />

  <!-- Terminal Window Header -->
  <rect x="80" y="60" width="1120" height="48" rx="16" fill="#0f172a" />
  <circle cx="115" cy="84" r="7" fill="#ef4444" />
  <circle cx="138" cy="84" r="7" fill="#f59e0b" />
  <circle cx="161" cy="84" r="7" fill="#10b981" />
  <text x="640" y="90" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="700" letter-spacing="2">INTENT-VALIDATOR-QA // NLP VALIDATION ENGINE</text>

  <!-- Centerpiece: Intent Classification Node Graph -->
  <g transform="translate(640, 310)">
    <!-- Central Shield & Verification Badge -->
    <circle cx="0" cy="-40" r="70" fill="#0f172a" stroke="url(#cyanNeon)" stroke-width="3" filter="url(#qaGlow)" />
    <path d="M -25 -40 L -5 -20 L 25 -60" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#qaGlow)" />

    <!-- Typography -->
    <text x="0" y="80" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">INTENT VALIDATOR QA</text>
    <text x="0" y="115" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#38bdf8" text-anchor="middle" font-weight="600" letter-spacing="3">RULES-BASED INTENT CLASSIFIER • DISAMBIGUATION • GAS &amp; NODE.JS</text>
  </g>

  <!-- Left: Raw Utterance Flow -->
  <g transform="translate(130, 200)">
    <rect width="210" height="240" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="15" y="15" width="90" height="10" rx="4" fill="#ef4444" opacity="0.8" />
    <text x="15" y="45" font-family="monospace" font-size="12" fill="#f8fafc">"Trigger Phrase"</text>
    <text x="15" y="65" font-family="monospace" font-size="10" fill="#64748b">Raw input strings</text>
    <line x1="15" y1="85" x2="195" y2="85" stroke="#334155" stroke-width="1" />
    <text x="15" y="110" font-family="monospace" font-size="11" fill="#38bdf8">normalizeHeader_()</text>
    <text x="15" y="130" font-family="monospace" font-size="11" fill="#38bdf8">headerMap_()</text>
    <text x="15" y="150" font-family="monospace" font-size="11" fill="#38bdf8">isIntegrationSheet_()</text>
  </g>

  <!-- Right: Classified Output -->
  <g transform="translate(940, 200)">
    <rect width="210" height="240" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="15" y="15" width="90" height="10" rx="4" fill="#10b981" opacity="0.8" />
    <text x="15" y="45" font-family="monospace" font-size="12" fill="#f8fafc">Classified Intent</text>
    <text x="15" y="65" font-family="monospace" font-size="10" fill="#64748b">Verified action target</text>
    <line x1="15" y1="85" x2="195" y2="85" stroke="#334155" stroke-width="1" />
    <rect x="15" y="100" width="180" height="22" rx="4" fill="#065f46" />
    <text x="25" y="115" font-family="monospace" font-size="10" fill="#34d399" font-weight="bold">Create Record [NEW]</text>
    <rect x="15" y="130" width="180" height="22" rx="4" fill="#1e3a8a" />
    <text x="25" y="145" font-family="monospace" font-size="10" fill="#60a5fa" font-weight="bold">Update Record [MOD]</text>
    <rect x="15" y="160" width="180" height="22" rx="4" fill="#581c87" />
    <text x="25" y="175" font-family="monospace" font-size="10" fill="#c084fc" font-weight="bold">Search/Query [FIND]</text>
  </g>
</svg>
